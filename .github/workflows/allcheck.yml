name: allcheck

# 全量回归护栏：每次 push / PR 到 main 时，在无浏览器、无 IDE、无网络的 headless 环境
# 跑一遍 ./allcheck.sh（JS 语法 → JSON → 数据健康 → 单测 → WXML → 事件配对 → 网页同源冒烟
# → 合并门禁 → 体积预算 → 发布安全门禁 → 材料口径）。任一红项即判失败，阻断合入。
#
# 凭据门禁：公开仓库里的 utils/keys.js / tools/_src-backup/keys.js 提交态一律为空串（明文已移出），
# check-secrets 因此常绿；若有人误把真实 Key 提交进仓，CI 会立刻变红（这正是护栏要拦的）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: allcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  allcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # build-min.mjs（合并门禁调用）依赖 terser；其余步骤均零 npm 依赖、纯 Node 内置模块。
      - name: 安装工具链依赖（terser）
        run: npm install

      - name: 运行全量回归 allcheck.sh
        run: bash allcheck.sh

      - name: 失败定位提示
        if: failure()
        run: |
          echo "::error::allcheck 存在失败步骤，请在本机先跑 './allcheck.sh' 复现并修复后再推送。"
          echo "提示：凭据门禁变红通常意味着把明文 Key 提交进了公开仓库，请改用运行时注入（keys.js 留空）。"
