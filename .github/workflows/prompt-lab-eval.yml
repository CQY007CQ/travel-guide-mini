name: prompt-lab-eval

on:
  push:
    branches: [main]
    paths:
      - 'prompt-lab/**'
      - 'docs/prompt-engineering-travel-assistant.md'
  pull_request:
    paths:
      - 'prompt-lab/**'
      - 'docs/prompt-engineering-travel-assistant.md'

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 第一轮 · 正常资料端到端执行评测
        run: python3 prompt-lab/travel_run_eval.py
      - name: 第二轮 · 故障注入鲁棒性评测
        run: python3 prompt-lab/fault_eval.py
      - name: 展示评分摘要
        run: |
          echo "=== 第一轮实测报告 ==="
          sed -n '1,40p' prompt-lab/执行评测报告.md
          echo "=== 第二轮故障注入报告（关键发现） ==="
          sed -n '/## 四、关键发现/,/## 五、诚实边界/p' prompt-lab/故障注入评测报告.md
