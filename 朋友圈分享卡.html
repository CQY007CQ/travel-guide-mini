<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行攻略生成器 · 朋友圈分享卡</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f4f4f2; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { width: 640px; background: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,0.08); }
  .head { background: #1d9e75; padding: 28px 32px 22px; color: #fff; }
  .head .eyebrow { font-size: 13px; opacity: .8; letter-spacing: 1px; }
  .head h1 { font-size: 34px; font-weight: 600; margin-top: 6px; }
  .head .sub { font-size: 15px; opacity: .92; margin-top: 8px; line-height: 1.6; }
  .body { padding: 28px 32px 20px; }
  .stats { display: flex; gap: 12px; margin-bottom: 22px; }
  .stat { flex: 1; border: 1px solid #e6e6e2; border-radius: 12px; padding: 14px 12px; text-align: center; }
  .stat .num { font-size: 22px; font-weight: 600; color: #1d9e75; }
  .stat .lab { font-size: 12px; color: #777; margin-top: 4px; }
  .points { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .point { background: #f7f8f6; border-radius: 10px; padding: 14px 14px; font-size: 14px; color: #333; line-height: 1.5; }
  .point b { color: #1d9e75; }
  .foot { padding: 16px 32px 24px; border-top: 1px solid #efefeb; display: flex; align-items: center; justify-content: space-between; }
  .qr { width: 96px; height: 96px; border: 1px dashed #bbb; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #999; font-size: 12px; text-align: center; background: #fafaf8; }
  .foot-txt { font-size: 13px; color: #666; line-height: 1.7; padding-right: 16px; }
  .foot-txt b { color: #1d9e75; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="eyebrow">TRAVEL PLAN · 微信小程序</div>
      <h1>旅行攻略生成器</h1>
      <div class="sub">选城市、填天数，自动排出逐日行程。全程离线，数据只存自己手机。</div>
    </div>
    <div class="body">
      <div class="stats">
        <div class="stat"><div class="num">420+</div><div class="lab">覆盖城市</div></div>
        <div class="stat"><div class="num">2.6万</div><div class="lab">真实景点</div></div>
        <div class="stat"><div class="num">离线</div><div class="lab">免注册可用</div></div>
      </div>
      <div class="points">
        <div class="point"><b>逐日行程</b><br>景点 / 住宿 / 美食 / 预算按天排好</div>
        <div class="point"><b>行程体检</b><br>动线、节奏、重复自动检查</div>
        <div class="point"><b>换景点</b><br>闭馆或下雨，换同类替代</div>
        <div class="point"><b>行李清单</b><br>按季节和目的地自动生成</div>
      </div>
    </div>
    <div class="foot">
      <div class="foot-txt">微信扫一扫<br><b>立即生成你的旅行攻略</b></div>
      <div class="qr">小程序码<br>放这里</div>
    </div>
  </div>
</body>
</html>
