<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0d0d0d"/>
<!-- #114 安全门禁：限定资源与出站连接仅来自同源 + 已知天气/地理 API，抑制 XSS 影响面与任意出站。
     内联 script/style 暂放行（'unsafe-inline'）；可选大模型(api.openai.com)被拦后会优雅回退离线助手。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://*.qweatherapi.com https://*.amap.com"/>
<title>旅行攻略生成器 · 网页版</title>
<link rel="stylesheet" href="lib/app.css?v=9605b20a"/>
<link rel="stylesheet" href="shell.css?v=9605b20a"/>
<link rel="stylesheet" href="ai-assistant.css?v=9605b20a"/>
</head>
<body>
  <!-- 启动遮罩：数据包解压需要一点时间，避免白屏 -->
  <div id="boot">
    <div class="boot-box">
      <div class="boot-ring"></div>
      <div class="boot-t">旅行攻略生成器</div>
      <div class="boot-s" id="bootMsg">正在加载离线知识库…</div>
    </div>
  </div>

  <div id="app"></div>

  <!-- tabBar：仅 4 个 tab 页显示 -->
  <nav id="tabbar" class="hidden">
    <a class="tb" data-p="pages/index/index"><img alt="出发"/><span>出发</span></a>
    <a class="tb" data-p="pages/today/today"><img alt="今天"/><span>今天</span></a>
    <a class="tb" data-p="pages/plan/plan"><img alt="行程"/><span>行程</span></a>
    <a class="tb" data-p="pages/more/more"><img alt="更多"/><span>更多</span></a>
  </nav>

  <script src="lib/modules.js?v=9605b20a"></script>
  <script src="lib/data.js?v=9605b20a"></script>
  <script src="lib/tpl.js?v=9605b20a"></script>
  <script src="lib/nav.js?v=9605b20a"></script>
  <script src="lib/runtime.js?v=9605b20a"></script>
  <script src="app.js?v=9605b20a"></script>
  <script src="ai-assistant.js?v=9605b20a"></script>

  <!-- 网页版数据互通：导出 / 导入备份文件（与小程序同 schema，可跨端迁移数据） -->
  <div id="webDataBar">
    <button id="webToolsToggle" type="button">工具 / 布局</button>
    <div id="webTools" class="hidden">
      <button id="webLayoutBtn" type="button">宽屏 / 单列</button>
      <button id="webNavOpen" type="button">全部页面</button>
      <button id="webExport" type="button">导出数据</button>
      <button id="webImport" type="button">导入数据</button>
    </div>
    <input id="webImpFile" type="file" accept="application/json,.json" hidden/>
  </div>
  <style>
    #webDataBar{position:fixed;left:10px;bottom:64px;z-index:9998;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
    #webDataBar button{font:13px/1 -apple-system,system-ui,sans-serif;color:#e8eef7;background:rgba(28,32,40,.92);
      border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:9px 12px;cursor:pointer;backdrop-filter:blur(6px);
      box-shadow:0 4px 14px rgba(0,0,0,.35)}
    #webDataBar button:active{transform:scale(.96)}
    #webTools{display:flex;flex-direction:column;gap:6px}
    #webTools.hidden{display:none}
    @media(min-width:720px){#webDataBar{bottom:18px}}
    @media(min-width:1100px){#webDataBar{left:calc(var(--sidebar-w, 224px) + 12px);bottom:12px}
      #webTools{flex-direction:row;flex-wrap:wrap;max-width:calc(100vw - var(--sidebar-w, 224px) - 24px)}}
  </style>
  <script>
  (function () {
    function T() { try { return window.__require("__entry__", "./utils/travel.js"); } catch (e) { return null; } }
    function toast(msg) {
      var d = document.createElement("div");
      d.textContent = msg;
      d.style.cssText = "position:fixed;left:50%;top:18px;transform:translateX(-50%);background:rgba(18,20,26,.94);" +
        "color:#fff;padding:9px 14px;border-radius:9px;font:13px/1.4 -apple-system,system-ui,sans-serif;z-index:9999;max-width:82vw;text-align:center";
      document.body.appendChild(d);
      setTimeout(function () { d.remove(); }, 2800);
    }
    var ex = document.getElementById("webExport"), im = document.getElementById("webImport"), fi = document.getElementById("webImpFile");
    if (ex) ex.onclick = function () {
      var t = T(); if (!t) { toast("数据尚未就绪，请稍候"); return; }
      var json; try { json = t.exportBackup(); } catch (e) { toast("导出失败"); return; }
      if (!json) { toast("暂无可导出数据"); return; }
      var blob = new Blob([json], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "travel-backup-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      toast("已导出备份文件（" + json.length + " 字符）");
    };
    if (im) im.onclick = function () { if (fi) fi.click(); };
    if (fi) fi.onchange = function () {
      var f = fi.files && fi.files[0]; if (!f) return;
      // 先挡超大文件，避免 readAsText 把整份读进内存后才被 importBackup 的长度守卫拒绝
      if (f.size > 2 * 1024 * 1024) { toast("文件过大（上限 2MB）"); fi.value = ""; return; }
      var rd = new FileReader();
      rd.onerror = rd.onabort = function () { toast("文件读取失败，请重试"); fi.value = ""; };
      rd.onload = function () {
        // 立刻清空：任何提前 return 的分支之后都还能重选同一个文件（否则 onchange 不再触发）
        fi.value = "";
        var t = T(); if (!t) { toast("数据尚未就绪，请稍候"); return; }
        try {
          var r = t.importBackup(String(rd.result || ""));
          // 网页端等价「app.setPlan」：plan 页读 app.globalData.plan，必须同步否则刷新不显示
          if (window.__APP_CONFIG && r.plan) window.__APP_CONFIG.globalData.plan = r.plan;
          toast("已恢复 " + r.count + " 组数据" + (r.hasPlan ? "（含行程）" : ""));
          if (window.__webRefresh) window.__webRefresh();
        } catch (e) { toast("导入失败：" + (e && e.message ? String(e.message).slice(0, 40) : "文件不是有效备份")); }
      };
      rd.readAsText(f);
    };
  })();
  </script>
</body>
</html>
