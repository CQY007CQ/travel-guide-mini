<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0d0d0d"/>
<!-- #114 安全门禁：限定资源与出站连接仅来自同源 + 已知天气/地理 API，抑制 XSS 影响面与任意出站。
     内联 script/style 暂放行（'unsafe-inline'）；可选大模型(api.openai.com)被拦后会优雅回退离线助手。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tcloudbaseapp.com https://*.myqcloud.com; font-src 'self' data:; connect-src 'self' https://*.qweatherapi.com https://*.amap.com *.tcloudbaseg.com *.tcloudbaseapp.com *.cloudbase.net *.tcb-api.tencentcloudapi.com"/>
<title>旅行攻略生成器 · 网页版</title>
<!-- 网页首屏加速：data.js（2.4MB 离线库）改为 <script async> 懒加载，先让出首屏解析/绘制，
     其 onload 后再 resolve 这个承诺；utils/data.js 的 initData 网页分支 await 它再解包，
     既不被同步解压阻塞，又保证解包时数据块工厂已注册（否则 require 抛错丢数据）。 -->
<script>window.__dataReadyP=new Promise(function(r){window.__dataReadyResolve=r;});</script>
<link rel="stylesheet" href="lib/app.css?v=bbb041cd"/>
<link rel="stylesheet" href="shell.css?v=bbb041cd"/>
<link rel="stylesheet" href="ai-assistant.css?v=bbb041cd"/>
</head>
<body>
  <!-- 启动遮罩：数据包解压需要一点时间，避免白屏 -->
  <div id="boot">
    <div class="boot-box">
      <div class="boot-ring"></div>
      <div class="boot-t">旅行攻略生成器</div>
      <div class="boot-s" id="bootMsg">正在加载离线知识库…</div>
    </div>
  </div>

  <div id="app"></div>

  <!-- tabBar：仅 4 个 tab 页显示 -->
  <nav id="tabbar" class="hidden">
    <a class="tb" data-p="pages/index/index"><img alt="出发"/><span>出发</span></a>
    <a class="tb" data-p="pages/today/today"><img alt="今天"/><span>今天</span></a>
    <a class="tb" data-p="pages/plan/plan"><img alt="行程"/><span>行程</span></a>
    <a class="tb" data-p="pages/more/more"><img alt="更多"/><span>更多</span></a>
  </nav>

  <script defer src="lib/modules.js?v=bbb041cd"></script>
  <script async src="lib/data.js?v=bbb041cd" onload="window.__dataReadyResolve&&window.__dataReadyResolve()" onerror="window.__dataReadyResolve&&window.__dataReadyResolve()"></script>
  <script defer src="lib/tpl.js?v=bbb041cd"></script>
  <script defer src="lib/nav.js?v=bbb041cd"></script>
  <script defer src="lib/runtime.js?v=bbb041cd"></script>
  <script defer src="lib/cloud-web.js?v=bbb041cd"></script>
  <script defer src="app.js?v=bbb041cd"></script>
  <script defer src="ai-assistant.js?v=bbb041cd"></script>

  <!-- 网页版数据互通：导出 / 导入备份文件（与小程序同 schema，可跨端迁移数据） -->
  <div id="webDataBar">
    <button id="webToolsToggle" type="button">工具 / 布局</button>
    <div id="webTools" class="hidden">
      <button id="webLayoutBtn" type="button">宽屏 / 单列</button>
      <button id="webNavOpen" type="button">全部页面</button>
      <button id="webExport" type="button">导出数据</button>
      <button id="webImport" type="button">导入数据</button>
      <button id="webCopySync" type="button">复制同步码</button>
      <button id="webInputSync" type="button">输入同步码</button>
      <button id="webPush" type="button">上传云端</button>
      <button id="webPull" type="button">云端恢复</button>
    </div>
    <input id="webImpFile" type="file" accept="application/json,.json" hidden/>
  </div>
  <style>
    #webDataBar{position:fixed;left:10px;bottom:64px;z-index:9998;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
    #webDataBar button{font:13px/1 -apple-system,system-ui,sans-serif;color:#e8eef7;background:rgba(28,32,40,.92);
      border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:9px 12px;cursor:pointer;backdrop-filter:blur(6px);
      box-shadow:0 4px 14px rgba(0,0,0,.35)}
    #webDataBar button:active{transform:scale(.96)}
    #webTools{display:flex;flex-direction:column;gap:6px}
    #webTools.hidden{display:none}
    @media(min-width:720px){#webDataBar{bottom:18px}}
    @media(min-width:1100px){#webDataBar{left:calc(var(--sidebar-w, 224px) + 12px);bottom:12px}
      #webTools{flex-direction:row;flex-wrap:wrap;max-width:calc(100vw - var(--sidebar-w, 224px) - 24px)}}
  </style>
  <script>
  (function () {
    function T() { try { return window.__require("__entry__", "./utils/travel.js"); } catch (e) { return null; } }
    function toast(msg) {
      var d = document.createElement("div");
      d.textContent = msg;
      d.style.cssText = "position:fixed;left:50%;top:18px;transform:translateX(-50%);background:rgba(18,20,26,.94);" +
        "color:#fff;padding:9px 14px;border-radius:9px;font:13px/1.4 -apple-system,system-ui,sans-serif;z-index:9999;max-width:82vw;text-align:center";
      document.body.appendChild(d);
      setTimeout(function () { d.remove(); }, 2800);
    }
    var ex = document.getElementById("webExport"), im = document.getElementById("webImport"), fi = document.getElementById("webImpFile");
    if (ex) ex.onclick = function () {
      var t = T(); if (!t) { toast("数据尚未就绪，请稍候"); return; }
      var json; try { json = t.exportBackup(); } catch (e) { toast("导出失败"); return; }
      if (!json) { toast("暂无可导出数据"); return; }
      var blob = new Blob([json], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "travel-backup-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      toast("已导出备份文件（" + json.length + " 字符）");
    };
    if (im) im.onclick = function () { if (fi) fi.click(); };
    if (fi) fi.onchange = function () {
      var f = fi.files && fi.files[0]; if (!f) return;
      // 先挡超大文件，避免 readAsText 把整份读进内存后才被 importBackup 的长度守卫拒绝
      if (f.size > 2 * 1024 * 1024) { toast("文件过大（上限 2MB）"); fi.value = ""; return; }
      var rd = new FileReader();
      rd.onerror = rd.onabort = function () { toast("文件读取失败，请重试"); fi.value = ""; };
      rd.onload = function () {
        // 立刻清空：任何提前 return 的分支之后都还能重选同一个文件（否则 onchange 不再触发）
        fi.value = "";
        var t = T(); if (!t) { toast("数据尚未就绪，请稍候"); return; }
        try {
          var r = t.importBackup(String(rd.result || ""));
          // 网页端等价「app.setPlan」：plan 页读 app.globalData.plan，必须同步否则刷新不显示
          if (window.__APP_CONFIG && r.plan) window.__APP_CONFIG.globalData.plan = r.plan;
          toast("已恢复 " + r.count + " 组数据" + (r.hasPlan ? "（含行程）" : ""));
          if (window.__webRefresh) window.__webRefresh();
        } catch (e) { toast("导入失败：" + (e && e.message ? String(e.message).slice(0, 40) : "文件不是有效备份")); }
      };
      rd.readAsText(f);
    };
  })();
  /* ── 网页版云互通：复制/输入同步码 + 上传/恢复行程（本地优先，未配云环境则提示） ── */
  (function () {
    function C() { try { return window.__require("__entry__", "./utils/cloud.js"); } catch (e) { return null; } }
    function CS() { try { return window.__require("__entry__", "./utils/cloud-sync.js"); } catch (e) { return null; } }
    function currentPlan() { try { return (window.__APP_CONFIG && window.__APP_CONFIG.globalData && window.__APP_CONFIG.globalData.plan) || null; } catch (e) { return null; } }
    function fallbackCopy(t) {
      try {
        var ta = document.createElement("textarea");
        ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); ta.remove(); toast("同步码已复制：" + t);
      } catch (e) { toast("复制失败，请手动记录：" + t); }
    }
    var copyBtn = document.getElementById("webCopySync");
    if (copyBtn) copyBtn.onclick = function () {
      var c = C(); if (!c) { toast("同步模块未就绪，请稍候"); return; }
      var code = c.getPairedUid() || c.localUid();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(function () { toast("同步码已复制：" + code); }, function () { fallbackCopy(code); });
      } else fallbackCopy(code);
    };
    var inBtn = document.getElementById("webInputSync");
    if (inBtn) inBtn.onclick = function () {
      var c = C(); if (!c) { toast("同步模块未就绪，请稍候"); return; }
      var v = window.prompt("粘贴另一端复制的同步码（u_ 开头）：", "");
      if (v == null) return;
      if (c.setPairedUid(v)) toast("已关联，可跨端同步"); else toast("同步码无效");
    };
    var pushBtn = document.getElementById("webPush");
    if (pushBtn) pushBtn.onclick = function () {
      var c = C(); if (!c) { toast("同步模块未就绪，请稍候"); return; }
      if (!c.cloudEnabled()) { toast("未配置云环境（cloudEnv 为空）"); return; }
      var cs = CS(); if (!cs) { toast("同步模块未就绪，请稍候"); return; }
      cs.pushPlan(currentPlan()).then(function (r) {
        toast(r && r.ok ? "已上传到云端" : "上传失败：" + ((r && r.reason) || ""));
      }).catch(function () { toast("上传异常"); });
    };
    var pullBtn = document.getElementById("webPull");
    if (pullBtn) pullBtn.onclick = function () {
      var c = C(); if (!c) { toast("同步模块未就绪，请稍候"); return; }
      if (!c.cloudEnabled()) { toast("未配置云环境（cloudEnv 为空）"); return; }
      var cs = CS(); if (!cs) { toast("同步模块未就绪，请稍候"); return; }
      cs.pullLatest().then(function (r) {
        if (r && r.ok && r.plan) {
          if (window.__APP_CONFIG) window.__APP_CONFIG.globalData.plan = r.plan;
          if (window.__webRefresh) window.__webRefresh();
          toast("已从云端恢复");
        } else toast("恢复失败：" + ((r && r.reason) || ""));
      }).catch(function () { toast("恢复异常"); });
    };
  })();
  </script>
</body>
</html>
